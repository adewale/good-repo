name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate JSON
        run: |
          python3 -m json.tool package.json >/dev/null
          python3 -m json.tool skills.sh.json >/dev/null
          python3 -m json.tool evals/evals.json >/dev/null
          python3 -m json.tool evals/trigger-queries.json >/dev/null
          python3 -m json.tool .claude-plugin/marketplace.json >/dev/null
      - name: Check scripts
        run: |
          bash -n skills/good-repo/scripts/check-repo-readiness.sh
          python3 -m py_compile skills/good-repo/scripts/audit-github-owner.py
          python3 -m py_compile evals/run_eval.py
          python3 -m py_compile evals/run_fixture_tests.py
      - name: Validate eval schemas
        run: |
          python3 evals/run_eval.py validate
      - name: Run fixture evals
        run: |
          python3 evals/run_fixture_tests.py
      - name: Check internal Markdown links and anchors (fence-aware)
        env:
          LYCHEE_VERSION: '0.24.2'
          LYCHEE_SHA256: 1f4e0ef7f6554a6ed33dd7ac144fb2e1bbed98598e7af973042fc5cd43951c9a
        run: |
          curl -sSfL -o "$RUNNER_TEMP/lychee.tgz" "https://github.com/lycheeverse/lychee/releases/download/lychee-v${LYCHEE_VERSION}/lychee-x86_64-unknown-linux-gnu.tar.gz"
          echo "${LYCHEE_SHA256}  $RUNNER_TEMP/lychee.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/lychee.tgz" -C "$RUNNER_TEMP"
          "$RUNNER_TEMP/lychee-x86_64-unknown-linux-gnu/lychee" --offline --include-fragments --no-progress '**/*.md'
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Run model-free harness gate (pinned skill-eval-harness 0.6.0)
        run: |
          uvx --from skill-eval-harness==0.6.0 skill-benchmark validate --strict-leakage --check-ablations evals/shared-benchmark.json
          uvx --from skill-eval-harness==0.6.0 skill-benchmark audit-manifest --fail-on-blockers evals/shared-benchmark.json > /dev/null
      - name: Run repo readiness script
        run: |
          bash skills/good-repo/scripts/check-repo-readiness.sh
